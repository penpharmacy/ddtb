  <head>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

      body {
        font-family: 'Sarabun', sans-serif;<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel - วงล้อสุ่มนำโชค</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --bg-color: #f1f2f6;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* Wheel Styling */
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }

        /* Control Panel */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            width: 300px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            font-family: 'Kanit', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-spin { background: var(--secondary-color); color: white; }
        .btn-spin:hover { background: #26af5f; transform: scale(1.02); }
        .btn-update { background: #57606f; color: white; font-size: 14px; }

        .winner-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            z-index: 100;
            text-align: center;
            transition: 0.3s;
        }

        .winner-popup.active { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <h1 style="color: #2f3542;">🎡 วงล้อสุ่มผู้โชคดี</h1>

    <div class="main-container">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel"></canvas>
        </div>

        <div class="controls">
            <h3>รายการตัวเลข/ชื่อ</h3>
            <textarea id="itemsInput" placeholder="ใส่ชื่อหรือเลข แยกบรรทัดกัน">เลข 1
เลข 2
เลข 3
เลข 4
เลข 5</textarea>
            <button class="btn btn-update" onclick="updateWheel()">อัปเดตข้อมูล</button>
            <button id="spinBtn" class="btn btn-spin" onclick="spinWheel()">หมุนวงล้อ!</button>
            <p id="status" style="text-align: center; color: #777;">เหลือทั้งหมด: 5 รายการ</p>
        </div>
    </div>

    <div id="winnerPopup" class="winner-popup">
        <h2 style="margin:0; color: #777;">ยินดีด้วย!</h2>
        <h1 id="winnerName" style="font-size: 3rem; color: var(--primary-color); margin: 10px 0;">?</h1>
        <p>ต้องการนำชื่อนี้ออกจากวงล้อหรือไม่?</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-spin" onclick="confirmRemove(true)">ลบออก</button>
            <button class="btn btn-update" onclick="confirmRemove(false)">เก็บไว้</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let items = [];
        let currentRotation = 0;
        let isSpinning = false;
        let selectedIdx = null;

        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#3742fa', '#70a1ff', '#eccc68', '#ff7f50'];

        function updateWheel() {
            const text = document.getElementById('itemsInput').value;
            items = text.split('\n').filter(i => i.trim() !== "");
            document.getElementById('status').innerText = `เหลือทั้งหมด: ${items.length} รายการ`;
            drawWheel();
        }

        function drawWheel() {
            const n = items.length;
            const arc = (2 * Math.PI) / n;
            canvas.width = 400;
            canvas.height = 400;
            
            ctx.clearRect(0, 0, 400, 400);
            
            items.forEach((item, i) => {
                const angle = i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 190, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                // วาดข้อความ
                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 16px Kanit";
                ctx.fillText(item.substring(0, 15), 170, 10);
                ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning || items.length === 0) return;
            
            isSpinning = true;
            const spinAngle = Math.floor(Math.random() * 360) + 3600; // หมุน 10 รอบ+
            currentRotation += spinAngle;
            
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const actualRotation = currentRotation % 360;
                const arcSize = 360 / items.length;
                // คำนวณหา index (ต้องลบจาก 360 เพราะวงล้อหมุนตามเข็ม)
                selectedIdx = Math.floor((360 - (actualRotation % 360)) / arcSize) % items.length;
                
                showWinner(items[selectedIdx]);
            }, 4000);
        }

        function showWinner(name) {
            document.getElementById('winnerName').innerText = name;
            document.getElementById('winnerPopup').classList.add('active');
        }

        function confirmRemove(shouldRemove) {
            if (shouldRemove) {
                items.splice(selectedIdx, 1);
                document.getElementById('itemsInput').value = items.join('\n');
                updateWheel();
            }
            document.getElementById('winnerPopup').classList.remove('active');
        }

        // เริ่มต้น
        updateWheel();
    </script>
</body>
</html>
